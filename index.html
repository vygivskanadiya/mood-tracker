<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Трекер настрою</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Трекер настрою</h1>
    <nav class="main-nav" aria-label="Основна навігація">
      <a href="#/" data-link>Додати запис</a>
      <a href="#/history" data-link>Історія</a>
      <a href="#/stats" data-link>Статистика</a>
      <a href="#/community" data-link>Нотатки спільноти</a>
    </nav>
  </header>

  <div class="layout">
    <main id="app"></main>

    <aside class="summary">
      <h2>Коротка статистика</h2>
      <p id="records-count">Записів за тиждень: 0</p>
      <p id="avg-mood">Середній настрій: —</p>
    </aside>
  </div>

  <footer>
    <p>Навчальний проєкт «Трекер настрою». &copy; 2026</p>
  </footer>

  <template id="tpl-home">
    <section id="mood-form">
      <h2>Відмітити настрій</h2>
      <form id="add-mood-form">
        <label for="mood-date">Дата</label>
        <input type="date" id="mood-date" class="field" name="date" required>

        <label for="mood-level">Рівень настрою (1–5)</label>
        <input type="number" id="mood-level" class="field" name="mood" min="1" max="5" required>

        <label for="mood-note">Коментар</label>
        <textarea id="mood-note" class="field" name="note" maxlength="200" placeholder="Що вплинуло на настрій?"></textarea>
        <span class="char-counter" id="note-counter">Залишилось символів: 200</span>

        <button type="submit" class="btn">Зберегти запис</button>
      </form>
      <p id="form-status" class="status" aria-live="polite"></p>
    </section>
  </template>

  <template id="tpl-history">
    <section id="history">
      <h2>Історія записів</h2>
      <div class="cards" id="mood-history">
        <p v-if="storageError" class="status error">{{ storageError }}</p>
        <mood-entry
          v-for="record in moodRecords"
          :key="record.id"
          :record-id="record.id"
          :date="record.date"
          :mood="record.mood"
          :note="record.note"
          @delete="removeRecord"
        ></mood-entry>
      </div>
    </section>
  </template>

  <template id="tpl-stats">
    <div class="view">
      <section id="stats">
        <h2>Статистика настрою</h2>
        <label for="stats-period">Період</label>
        <select id="stats-period" class="field">
          <option value="0">Весь час</option>
          <option value="7">Останні 7 днів</option>
          <option value="30">Останні 30 днів</option>
        </select>
        <p class="status">Відлік іде від дати останнього запису.</p>
        <div class="card stats-card">
          <p id="stats-range">Період: —</p>
          <p id="stats-count">Записів у періоді: 0</p>
          <p id="stats-average" class="stats-average">Середній настрій: —</p>
        </div>
      </section>

      <section id="mood-chart-section">
        <div class="section-head">
          <h2>Динаміка настрою</h2>
          <button type="button" class="btn btn-secondary" id="chart-toggle-btn">Пауза</button>
        </div>
        <canvas
          id="mood-chart"
          width="600"
          height="220"
          role="img"
          aria-label="Лінійний графік динаміки настрою за останні записи">
          Ваш браузер не підтримує Canvas — графік динаміки настрою недоступний.
        </canvas>
      </section>
    </div>
  </template>

  <template id="tpl-community">
    <section id="api-notes">
      <div class="section-head">
        <h2>Нотатки спільноти</h2>
        <button type="button" class="btn btn-secondary" id="reload-api-btn">Оновити</button>
      </div>
      <p id="api-status" class="status" aria-live="polite"></p>
      <div class="cards" id="api-notes-list"></div>
    </section>
  </template>
</body>
</html>
